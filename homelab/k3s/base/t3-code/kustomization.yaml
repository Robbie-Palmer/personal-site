  - service-account.yaml
  - persistent-volume-claim.yaml
  - deployment.yaml
  - service.yaml
labels:
  - pairs:
      app.kubernetes.io/name: t3-code
      app.kubernetes.io/part-of: agent-development
    includeSelectors: false
    includeTemplates: true
