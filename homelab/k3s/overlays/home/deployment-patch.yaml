apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-code
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  template:
    spec:
      nodeSelector:
        homelab.dev/capability: agent-workspace
        homelab.dev/location: home
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: t3-code
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
