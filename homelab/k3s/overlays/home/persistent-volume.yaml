apiVersion: v1
kind: PersistentVolume
metadata:
  name: t3-code-home
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 90Gi
  local:
    path: /srv/t3-code
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: homelab.dev/location
              operator: In
              values:
                - home
            - key: homelab.dev/capability
              operator: In
              values:
                - agent-workspace
  persistentVolumeReclaimPolicy: Retain
  storageClassName: t3-code-local
  volumeMode: Filesystem
