apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-code
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  template:
    spec:
      nodeSelector:
        homelab.dev/capability: agent-workspace
        homelab.dev/location: cloud
        homelab.dev/power-profile: always-on
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: t3-code
          env:
            - name: OPENCODE_CONFIG_CONTENT
              value: |
                {
                  "$schema": "https://opencode.ai/config.json",
                  "provider": {
                    "openrouter": {
                      "models": {
                        "z-ai/glm-5.3-flash": {
                          "name": "GLM 5.3 Flash"
                        }
                      }
                    }
                  }
                }
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
