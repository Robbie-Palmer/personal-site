apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-code
spec:
  template:
    spec:
      nodeSelector:
        homelab.dev/capability: agent-workspace
        homelab.dev/location: cloud
        homelab.dev/power-profile: always-on
      containers:
        - name: t3-code
          env:
            - name: OPENCODE_CONFIG_CONTENT
              value: |
                {
                  "$schema": "https://opencode.ai/config.json",
                  "provider": {
                    "openrouter": {
                      "models": {
                        "z-ai/glm-5.3-flash": {
                          "name": "GLM 5.3 Flash"
                        }
                      }
                    }
                  }
                }
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "3"
              memory: 6Gi
