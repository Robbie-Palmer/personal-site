apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: t3-code-pilot
resources:
  - ../../../../base/t3-code
  - doppler-secret.yaml
  - persistent-volume.yaml
  - priority-class.yaml
  - resource-quota.yaml
components:
  - ../../../../components/workspace-ingress-policy
  - ../../../../components/remote-workspace-policy
patches:
  - target:
      kind: Namespace
      name: t3-code
    patch: |-
      - op: replace
        path: /metadata/name
        value: t3-code-pilot
  - path: deployment-patch.yaml
  - path: persistent-volume-claim-patch.yaml
  - path: service-patch.yaml
labels:
  - pairs:
      homelab.dev/environment: remote-development
      homelab.dev/workspace: pilot
    includeSelectors: false
    includeTemplates: true
