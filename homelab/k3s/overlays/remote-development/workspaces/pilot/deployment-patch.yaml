apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-code
  namespace: t3-code
spec:
  template:
    metadata:
      annotations:
        secrets.doppler.com/reload: "true"
    spec:
      priorityClassName: pilot-workspace
      nodeSelector:
        homelab.dev/capability: agent-workspace
        homelab.dev/location: cloud
        homelab.dev/power-profile: always-on
      containers:
        - name: t3-code
          envFrom:
            - secretRef:
                name: t3-code-runtime
                optional: false
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
