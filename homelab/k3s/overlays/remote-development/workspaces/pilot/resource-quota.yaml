apiVersion: v1
kind: ResourceQuota
metadata:
  name: workspace
spec:
  hard:
    limits.cpu: "1"
    limits.memory: "1Gi"
    persistentvolumeclaims: "1"
    # The pilot Deployment uses Recreate, so updates never require a surge pod.
    pods: "1"
    requests.cpu: "1"
    requests.memory: "1Gi"
    requests.storage: "10Gi"
