---
- name: Confirm the Colima K3s role is running on the Mac mini
  ansible.builtin.assert:
    that:
      - ansible_facts.system == "Darwin"
      - ansible_facts.architecture == "arm64"
    fail_msg: The isolated Colima K3s profile is supported on the Apple Silicon Mac mini only.

- name: Locate the pinned Colima binary
  ansible.builtin.command:
    argv:
      - /usr/bin/which
      - colima
  check_mode: false
  changed_when: false
  register: colima_k3s_colima_binary

- name: Locate the pinned Lima binary
  ansible.builtin.command:
    argv:
      - /usr/bin/which
      - limactl
  check_mode: false
  changed_when: false
  register: colima_k3s_lima_binary

- name: Locate the pinned kubectl binary
  ansible.builtin.command:
    argv:
      - /usr/bin/which
      - kubectl
  check_mode: false
  changed_when: false
  register: colima_k3s_kubectl_binary

- name: Locate the Docker client
  ansible.builtin.command:
    argv:
      - /usr/bin/which
      - docker
  check_mode: false
  changed_when: false
  register: colima_k3s_docker_binary

- name: Inspect the Colima version
  ansible.builtin.command:
    argv:
      - "{{ colima_k3s_colima_binary.stdout }}"
      - version
  check_mode: false
  changed_when: false
  register: colima_k3s_colima_version

- name: Require the mise-pinned Colima release
  ansible.builtin.assert:
    that:
      - >-
        colima_k3s_colima_version.stdout_lines[0]
        == 'colima version v' ~ colima_k3s_required_colima_version
    fail_msg: >-
      Run this play through mise so Colima {{ colima_k3s_required_colima_version }} is first on PATH.

- name: Inspect the Lima version
  ansible.builtin.command:
    argv:
      - "{{ colima_k3s_lima_binary.stdout }}"
      - --version
  check_mode: false
  changed_when: false
  register: colima_k3s_lima_version

- name: Require the mise-pinned Lima release
  ansible.builtin.assert:
    that:
      - >-
        colima_k3s_lima_version.stdout_lines[0]
        == 'limactl version ' ~ colima_k3s_required_lima_version
    fail_msg: >-
      Run this play through mise so Lima {{ colima_k3s_required_lima_version }} is first on PATH.

- name: Create Colima K3s host directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ ansible_facts.env.HOME }}/.colima/{{ colima_k3s_profile }}"
      mode: "0700"
    - path: "{{ colima_k3s_data_path }}"
      mode: "0700"
    - path: "{{ ansible_facts.env.HOME }}/.local/bin"
      mode: "0755"
    - path: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents"
      mode: "0755"
    - path: "{{ ansible_facts.env.HOME }}/Library/Logs/homelab"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Install the isolated Colima K3s profile
  ansible.builtin.template:
    src: colima.yaml.j2
    dest: "{{ ansible_facts.env.HOME }}/.colima/{{ colima_k3s_profile }}/colima.yaml"
    mode: "0600"
  notify: Restart the managed Colima K3s profile

- name: Install the Colima K3s launch wrapper
  ansible.builtin.template:
    src: start-colima-k3s.sh.j2
    dest: "{{ ansible_facts.env.HOME }}/.local/bin/start-colima-k3s.sh"
    mode: "0700"
    validate: /bin/bash -n %s
  notify: Restart the managed Colima K3s profile

- name: Install the Colima K3s launchd definition
  ansible.builtin.template:
    src: homelab.colima-k3s.plist.j2
    dest: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/{{ colima_k3s_launchd_label }}.plist"
    mode: "0600"
    validate: /usr/bin/plutil -lint %s
  notify: Restart the managed Colima K3s profile

- name: Inspect the Colima K3s launchd job
  ansible.builtin.command:
    argv:
      - launchctl
      - print
      - "gui/{{ ansible_facts.user_uid }}/{{ colima_k3s_launchd_label }}"
  check_mode: false
  changed_when: colima_k3s_launchd_status.rc != 0
  failed_when: false
  register: colima_k3s_launchd_status
  notify: Restart the managed Colima K3s profile

- name: Inspect the isolated Colima K3s profile
  ansible.builtin.command:
    argv:
      - "{{ colima_k3s_colima_binary.stdout }}"
      - status
      - "{{ colima_k3s_profile }}"
  check_mode: false
  changed_when: colima_k3s_profile_before_apply.rc != 0
  failed_when: false
  register: colima_k3s_profile_before_apply
  notify: Restart the managed Colima K3s profile

- name: Apply pending Colima K3s handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for the isolated Colima profile
  ansible.builtin.command:
    argv:
      - "{{ colima_k3s_colima_binary.stdout }}"
      - status
      - "{{ colima_k3s_profile }}"
  check_mode: false
  changed_when: false
  delay: 5
  register: colima_k3s_profile_status
  retries: 60
  until: colima_k3s_profile_status.rc == 0
  when: not ansible_check_mode

- name: Wait for the K3s node
  ansible.builtin.command:
    argv:
      - "{{ colima_k3s_kubectl_binary.stdout }}"
      - --context
      - "{{ colima_k3s_context }}"
      - get
      - nodes
      - --selector=node-role.kubernetes.io/control-plane
      - --output=json
  check_mode: false
  changed_when: false
  delay: 5
  register: colima_k3s_nodes
  retries: 60
  until: >-
    colima_k3s_nodes.rc == 0
    and (colima_k3s_nodes.stdout | from_json).items | length == 1
  when: not ansible_check_mode

- name: Wait for the K3s node to become ready
  ansible.builtin.command:
    argv:
      - "{{ colima_k3s_kubectl_binary.stdout }}"
      - --context
      - "{{ colima_k3s_context }}"
      - wait
      - --for=condition=Ready
      - node
      - --all
      - --selector=node-role.kubernetes.io/control-plane
      - --timeout=300s
  check_mode: false
  changed_when: false
  when: not ansible_check_mode

- name: Reconcile K3s node placement labels
  ansible.builtin.command:
    argv:
      - "{{ colima_k3s_kubectl_binary.stdout }}"
      - --context
      - "{{ colima_k3s_context }}"
      - label
      - node
      - "{{ (colima_k3s_nodes.stdout | from_json).items[0].metadata.name }}"
      - "{{ item.key }}={{ item.value }}"
      - --overwrite
  changed_when: true
  loop: "{{ colima_k3s_node_labels | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - not ansible_check_mode
    - >-
      (colima_k3s_nodes.stdout | from_json).items[0].metadata.labels[item.key]
      | default('') != item.value

- name: Inspect the reconciled K3s node
  ansible.builtin.command:
    argv:
      - "{{ colima_k3s_kubectl_binary.stdout }}"
      - --context
      - "{{ colima_k3s_context }}"
      - get
      - nodes
      - --selector=node-role.kubernetes.io/control-plane
      - --output=json
  check_mode: false
  changed_when: false
  register: colima_k3s_reconciled_nodes
  when: not ansible_check_mode

- name: Require the K3s node placement labels
  ansible.builtin.assert:
    that:
      - >-
        (colima_k3s_reconciled_nodes.stdout | from_json).items[0].metadata.labels[item.key]
        | default('') == item.value
    fail_msg: "The Colima K3s node is missing {{ item.key }}={{ item.value }}."
  loop: "{{ colima_k3s_node_labels | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: not ansible_check_mode
