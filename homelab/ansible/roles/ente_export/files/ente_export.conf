# Ente export health alarms. ente-export-health.sh refreshes each StatsD
# gauge every minute. Notifications use Netdata's existing sysadmin route.

 template: ente_export_destination_unmounted
       on: statsd_ente.export_destination_mounted_gauge
     calc: $gauge
   every: 1m
    warn: $this == 0
   delay: down 5m
    info: The expected Ente export volume is not mounted on the Mac mini
     to: sysadmin

 template: ente_export_stale
       on: statsd_ente.export_fresh_gauge
     calc: $gauge
   every: 1m
    warn: $this == 0
   delay: down 10m
    info: The Ente export has no successful run in the last 48 hours
     to: sysadmin

 template: ente_export_failed
       on: statsd_ente.export_last_run_ok_gauge
     calc: $gauge
   every: 1m
    warn: $this == 0
   delay: down 2m
    info: The latest Ente export attempt failed
     to: sysadmin
