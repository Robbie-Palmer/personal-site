---
- name: Inspect loaded Ente launchd jobs
  ansible.builtin.command:
    argv:
      - launchctl
      - print
      - "gui/{{ ansible_facts.user_uid }}/{{ item }}"
  loop:
    - "{{ ente_export_launchd_label }}"
    - "{{ ente_export_health_launchd_label }}"
  changed_when: false
  failed_when: false
  register: ente_export_loaded_jobs
  listen: Reload Ente launchd jobs

- name: Refuse to reload an active Ente export
  ansible.builtin.assert:
    that:
      - "'state = running' not in (item.stdout | default(''))"
    fail_msg: Refusing to reload launchd while the Ente export is running.
  loop: "{{ ente_export_loaded_jobs.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.item == ente_export_launchd_label
    - item.rc | default(1) == 0
  listen: Reload Ente launchd jobs

- name: Unload loaded Ente launchd jobs
  ansible.builtin.command:
    argv:
      - launchctl
      - bootout
      - "gui/{{ ansible_facts.user_uid }}/{{ item.item }}"
  loop: "{{ ente_export_loaded_jobs.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc | default(1) == 0
  changed_when: true
  listen: Reload Ente launchd jobs

- name: Load Ente launchd jobs
  ansible.builtin.command:
    argv:
      - launchctl
      - bootstrap
      - "gui/{{ ansible_facts.user_uid }}"
      - "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/{{ item }}.plist"
  loop:
    - "{{ ente_export_launchd_label }}"
    - "{{ ente_export_health_launchd_label }}"
  changed_when: true
  listen: Reload Ente launchd jobs

- name: Reload Netdata health alarms
  ansible.builtin.command:
    argv:
      - launchctl
      - kickstart
      - -k
      - "gui/{{ ansible_facts.user_uid }}/{{ netdata_launchd_label }}"
  changed_when: true
