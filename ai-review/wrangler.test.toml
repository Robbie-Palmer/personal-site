name = "ai-review-test"
main = "src/index.ts"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

[vars]
AI_REVIEW_ENABLED = "true"
AI_REVIEW_DEBOUNCE_SECONDS = "120"
AI_REVIEW_OUTCOME_WINDOW_SECONDS = "1"
AI_REVIEW_OUTCOME_EVALUATOR_VERSION = "deterministic-outcomes-v1"

[[durable_objects.bindings]]
name = "PR_STATE"
class_name = "PullRequestCoordinator"

[[workflows]]
name = "ai-review-test"
binding = "REVIEW_WORKFLOW"
class_name = "ReviewWorkflow"

[[r2_buckets]]
binding = "REVIEW_DATA"
bucket_name = "ai-review-data-test"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PullRequestCoordinator"]
