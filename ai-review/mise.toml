[tasks.install]
description = "Install AI review dependencies"
run = "pnpm install --frozen-lockfile --filter ai-review..."

[tasks.typecheck]
description = "Typecheck the stateful AI review Worker"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
description = "Run the stateful AI review tests"
depends = ["install"]
run = "pnpm test"

[tasks.check]
description = "Run all stateful AI review checks"
depends = ["typecheck", "test"]

[tasks.deploy]
description = "Deploy the stateful AI review Worker"
depends = ["install"]
run = "bash scripts/deploy.sh"
