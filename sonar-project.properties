sonar.organization=robbie-palmer
sonar.projectKey=Robbie-Palmer_personal-site
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Keep test code out of production-code metrics and let SonarQube apply its
# test-specific analysis rules. Test inclusions are also source exclusions.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**/*,**/tests-runtime/**/*,ui/e2e/**/*

# Vendored design prototypes exported from Claude Design and their generated
# standalone build are not part of the maintained application source. Binary
# public assets are excluded so language sensors do not try to decode them as UTF-8.
# The scorecard query targets DuckDB rather than PL/SQL, so Sonar's PL/SQL rules
# do not apply to it; its behavior is covered by the scorecard fixture tests.
# The .vale tree is imported style packages (proselint, write-good) plus the
# site's own prose rules; it is data for Vale, not source Sonar should analyze.
# The recipe-parsing visualizer entry point only mounts the React application.
# SonarJasmin spends several minutes traversing its import graph whenever any
# JS/TS source changes, while the imported application files remain analyzed.
sonar.exclusions=ui/content/projects/*/designs/**,ui/public/recipe-site-design/standalone.html,**/coverage/**,ui/public/**/*.png,workers/recipe-api/drizzle/*.sql,ai-review/analytics/scorecard.sql,.vale/**,ml-pipelines/recipe-parsing/tools/viz/src/main.tsx

# Import coverage for Sonar's trend and built-in "Sonar way" new-code gate. The free plan
# cannot use a custom gate, so ADR 045 scopes that condition with the project
# version supplied by CI rather than buying a paid plan solely to remove it.
sonar.javascript.lcov.reportPaths=ai-review/coverage/lcov.info,ui/coverage/lcov.info,packages/observability/coverage/lcov.info,packages/recipe-parsing/coverage/lcov.info,ml-pipelines/ai-review-evaluation/coverage/lcov.info,ml-pipelines/recipe-parsing/coverage/lcov.info,workers/recipe-api/coverage/lcov.info,workers/recipe-ingest/coverage/lcov.info
sonar.python.coverage.reportPaths=ml-pipelines/wsi-analysis/coverage.xml
sonar.coverageReportPaths=cpp/autonomic-satellite-swarm/coverage/sonarqube.xml

# Top-level build/generator scripts are I/O tooling run at build time, not
# unit-tested application code, so keep them out of the coverage denominator.
# The scorecard report and replay CLIs are in the same category: they are
# operator CLIs driven by mise tasks and exercised by bash fixture tests that
# shell out to duckdb, which no LCOV runner observes. The R2 pull tool is the
# same kind of operator task, driven through Doppler against the live bucket.
# Spectral custom functions are the same category: rule logic executed by
# Spectral against the OpenAPI spec, not by the vitest suites (see recipe-site
# ADR 065). The Drizzle schema is declarative database metadata exercised by
# migration checks and integration tests, not application control flow.
# Homelab ops scripts (shell/python) run on the Mac mini host via mise tasks,
# outside any test runner. The satellite firmware adapters require Arduino
# platform APIs and remain compile-gated until physical hardware is available;
# the portable coordination core and host simulation retain coverage gates.
sonar.coverage.exclusions=ai-review/analytics/report.ts,ai-review/analytics/replay.ts,ai-review/analytics/corpus-replay.ts,ai-review/analytics/*.py,**/scripts/*.ts,**/scripts/*.mjs,**/spectral-functions/*.js,**/playwright*.config.ts,packages/recipe-db/src/schema.ts,homelab/**,cpp/autonomic-satellite-swarm/firmware/**

# The technologies registry is a curated data list where every entry repeats the
# same field schema (name/description/website/type); the copy-paste detector
# reads that inherent structural repetition as duplication. It is data, not
# logic, so keep it out of duplication detection.
sonar.cpd.exclusions=ui/content/technologies.ts

# The scorecard report and replay CLIs are operator tools run from a local
# terminal over the operator's own marts, manifests, baseline files, and
# executor processes. Their purpose is to read those inputs, write reports
# beside them, and log what they did; the taint-analysis rules below model a
# remote attacker influencing the CLI arguments, which does not apply to a
# single-user batch tool whose byte-identical determinism is fixture-tested.
# The satellite core and both reference adapters intentionally retain Arduino's C++11 boundary.
# Newer-language suggestions are not actionable there: using-enum and span require C++20,
# if-init and std::byte require C++17, and to_underlying requires C++23. The AVR standard library
# lacks std::array, so fixed C arrays remain necessary in shared/Uno code. The bounded indexed loop
# is also deliberate because its configured message budget is the loop's contract.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12
sonar.issue.ignore.multicriteria.e1.ruleKey=tssecurity:S8689
sonar.issue.ignore.multicriteria.e1.resourceKey=ai-review/analytics/*.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=tssecurity:S8705
sonar.issue.ignore.multicriteria.e2.resourceKey=ai-review/analytics/*.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.e3.resourceKey=ai-review/analytics/*.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e4.resourceKey=ai-review/analytics/*.ts
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e5.resourceKey=ml-pipelines/ai-review-evaluation/src/*.ts
