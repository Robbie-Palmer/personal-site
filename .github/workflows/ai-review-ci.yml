name: Stateful AI review CI

on:
  pull_request:
    paths:
      - "ai-review/**"
      - ".github/scripts/ai-review/**"
      - ".github/workflows/ai-review-ci.yml"
      - ".mise.toml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true

      - name: Check standalone project
        run: mise run //ai-review:check

      - name: Verify deploy bundle
        run: mise run //ai-review:deploy:dry-run
