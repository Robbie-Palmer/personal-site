[tasks.install]
description = "Install node-base dependencies"
run = "pnpm install --frozen-lockfile --filter node-base..."

[tasks.typecheck]
description = "Typecheck the Node.js base package"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
description = "Test the Node.js base package"
depends = ["install"]
run = "pnpm test"

[tasks."test:coverage"]
description = "Test the Node.js base package with coverage"
depends = ["install"]
run = "pnpm test:coverage"

[tasks.check]
description = "Check the Node.js base package"
depends = ["typecheck", "test"]
