[tasks.install]
description = "Install Work Graph domain dependencies"
run = "pnpm install --frozen-lockfile --filter work-graph-domain..."

[tasks.typecheck]
description = "Typecheck the Work Graph domain package"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
description = "Test the Work Graph domain package"
depends = ["install"]
run = "pnpm test"

[tasks."test:coverage"]
description = "Test the Work Graph domain package with coverage"
depends = ["install"]
run = "pnpm test:coverage"

[tasks.check]
description = "Check the Work Graph domain package"
depends = ["typecheck", "test"]
