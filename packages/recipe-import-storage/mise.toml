[tasks.install]
description = "Install recipe-import-storage dependencies"
run = "pnpm install --frozen-lockfile --filter recipe-import-storage..."

[tasks.typecheck]
description = "Typecheck the recipe import storage package"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
description = "Test the recipe import storage package"
depends = ["install"]
run = "pnpm test"

[tasks."test:coverage"]
description = "Test the recipe import storage package with coverage"
depends = ["install"]
run = "pnpm test:coverage"

[tasks.check]
description = "Check the recipe import storage package"
depends = ["typecheck", "test"]
