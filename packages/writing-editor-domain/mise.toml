[tasks.install]
description = "Install writing editor domain dependencies"
run = "pnpm install --frozen-lockfile --filter writing-editor-domain..."

[tasks.typecheck]
description = "Typecheck the writing editor domain package"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
description = "Test the writing editor domain package"
depends = ["install"]
run = "pnpm test"

[tasks."test:coverage"]
description = "Test the writing editor domain package with LCOV coverage"
depends = ["install"]
run = "pnpm test:coverage"

[tasks.check]
description = "Check the writing editor domain package"
depends = ["typecheck", "test"]
