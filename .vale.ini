StylesPath = .vale/styles

# The default lint gate reports only high-confidence, merge-blocking rules.
# Warning and suggestion rules remain outside CI, regardless of style package.
MinAlertLevel = error
SkippedScopes = blockquote

[*.md]
BasedOnStyles = Unslop

[*.mdx]
BasedOnStyles = Unslop

# Vendored style licenses live alongside each style directory.
# Deterministic enforcement is limited to newly changed lines by
# scripts/prose-lint.ts; see `mise run //:lint:prose -- --help`.
