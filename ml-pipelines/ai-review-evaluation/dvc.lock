          candidate:
            id: deepseek-v4-pro
            experiment:
              kind: scout-model
              models:
              - model: deepseek/deepseek-v4-pro
                provider: openrouter
          repetitions: 3
        limits:
          maxModels: 1
          allowedProviders:
          - openrouter
          maxScoutTokens: 8000
          maxMergerTokens: 6000
          maxCostUsdPerReplay: 0.25
          maxTotalCostUsd: 20
          timeoutMs: 120000
          requireZeroDataRetention: false
        matching:
          methods:
          - finding-id
          - file-hunk
          - file-line
          manualAdjudicationBelowConfidence: 0.9
