[tools]
arduino-cli = "1.5.1"

[tasks.configure]
description = "Configure the host build"
run = "cmake --preset dev"

[tasks.clean]
description = "Remove generated host build directories"
run = "cmake -E rm -rf build/dev build/sanitizers build/coverage build/browser coverage"

[tasks.build]
description = "Build the portable library, tests, and simulation"
depends = ["configure"]
run = "cmake --build --preset dev"

[tasks.test]
description = "Run host-side tests"
depends = ["build"]
run = "ctest --preset dev"

[tasks.simulate]
description = "Run the deterministic three-node simulation"
depends = ["build"]
run = "./build/dev/autonomic-satellite-swarm-simulation"

[tasks."simulate:json"]
description = "Print the browser visualization fixture from the native trace runner"
depends = ["build"]
run = "./build/dev/autonomic-satellite-swarm-simulation --json"

[tasks."browser:fixture:check"]
description = "Check that the committed browser fixture matches the native trace runner"
depends = ["build"]
run = '''
browser_fixture_check_file=$(mktemp)
trap 'cmake -E rm -f "$browser_fixture_check_file"' EXIT
./build/dev/autonomic-satellite-swarm-simulation --json > "$browser_fixture_check_file"
diff -u ../../ui/public/simulations/autonomic-satellite-swarm/demonstration.v2.json \
  "$browser_fixture_check_file"
'''

[tasks."browser:toolchain"]
description = "Install the pinned Emscripten SDK with its Python bootstrap dependency"
tools = { python = "3.14.6" }
run = "mise exec python@3.14.6 -- mise install asdf:mise-plugins/mise-emsdk@6.0.9"

[tasks."browser:configure"]
description = "Configure the Emscripten browser build"
depends = ["browser:toolchain"]
tools = { python = "3.14.6" }
run = "mise exec python@3.14.6 asdf:mise-plugins/mise-emsdk@6.0.9 -- emcmake cmake -S . -B build/browser -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DSATELLITE_SWARM_BUILD_BROWSER=ON"

[tasks."browser:build"]
description = "Build the WebAssembly adapter and copy its deployable artifacts"
depends = ["browser:configure"]
tools = { python = "3.14.6" }
run = '''
mise exec python@3.14.6 asdf:mise-plugins/mise-emsdk@6.0.9 -- cmake --build build/browser --target satellite_swarm_browser
browser_public_dir=../../ui/public/simulations/autonomic-satellite-swarm/wasm
cmake -E make_directory "$browser_public_dir"
cmake -E copy_if_different build/browser/browser/satellite-swarm.mjs "$browser_public_dir/satellite-swarm.mjs"
cmake -E copy_if_different build/browser/browser/satellite-swarm.wasm "$browser_public_dir/satellite-swarm.wasm"
'''

[tasks."browser:parity"]
description = "Check native and WebAssembly browser results for byte-for-byte parity"
depends = ["browser:build"]
run = "node browser/tests/browser_parity.mjs"

[tasks.lint]
description = "Run clang-tidy with warnings promoted to errors"
depends = ["configure"]
run = '''
gcc_install_dir=$(dirname "$(c++ -print-libgcc-file-name)")
compiler_root=$(dirname "$(dirname "$(readlink -f "$(command -v c++)")")")
compiler_sysroot="$compiler_root/$(c++ -dumpmachine)/sysroot"
find src simulation/src browser/src examples -type f -name '*.cpp' -print0 |
  xargs -0 clang-tidy -p build/dev \
    --extra-arg-before="--gcc-install-dir=$gcc_install_dir" \
    --extra-arg-before="--sysroot=$compiler_sysroot"
'''

[tasks.sanitize]
description = "Run tests with AddressSanitizer and UndefinedBehaviorSanitizer"
run = [
  "cmake --preset sanitizers",
  "cmake --build --preset sanitizers",
  "ctest --preset sanitizers",
]

[tasks.coverage]
description = "Generate SonarQube-compatible C++ coverage and enforce coverage floors"
run = [
  "cmake -E rm -rf build/coverage coverage",
  "cmake --preset coverage",
  "cmake --build --preset coverage",
  "ctest --preset coverage",
  "cmake -E make_directory coverage",
  "gcovr --root ../.. --filter 'src/satellite_swarm/' --filter 'simulation/' --filter 'browser/src/' --filter 'examples/simulation/' --sonarqube coverage/sonarqube.xml --print-summary --fail-under-line 80 --fail-under-branch 70 build/coverage",
]

[tasks."firmware:uno"]
description = "Compile the legacy Arduino Uno infrared firmware"
run = '''
node_id=${SATELLITE_SWARM_NODE_ID:-0}
case "$node_id" in
  ''|*[!0-9]*) echo "SATELLITE_SWARM_NODE_ID must be an integer from 0 to 15" >&2; exit 2 ;;
esac
if [ "$node_id" -gt 15 ]; then
  echo "SATELLITE_SWARM_NODE_ID must be an integer from 0 to 15" >&2
  exit 2
fi
arduino-cli compile --profile uno \
  --build-property "build.extra_flags=-DSATELLITE_SWARM_NODE_ID=$node_id" firmware/uno_ir
'''

[tasks."firmware:esp32"]
description = "Compile the modern ESP32 ESP-NOW firmware"
run = '''
node_id=${SATELLITE_SWARM_NODE_ID:-0}
case "$node_id" in
  ''|*[!0-9]*) echo "SATELLITE_SWARM_NODE_ID must be an integer from 0 to 15" >&2; exit 2 ;;
esac
if [ "$node_id" -gt 15 ]; then
  echo "SATELLITE_SWARM_NODE_ID must be an integer from 0 to 15" >&2
  exit 2
fi
arduino-cli compile --profile esp32 \
  --build-property "build.extra_flags=-DSATELLITE_SWARM_NODE_ID=$node_id" firmware/esp32_espnow
'''

[tasks."lint:typos"]
description = "Check spelling in the project"
run = "typos ."

[tasks.check]
description = "Run all project quality gates"
depends = [
  "//cpp:format:check",
  "test",
  "lint",
  "sanitize",
  "coverage",
  "firmware:uno",
  "firmware:esp32",
  "browser:fixture:check",
  "browser:parity",
  "lint:typos",
]
